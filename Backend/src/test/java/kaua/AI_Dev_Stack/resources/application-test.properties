# Banco H2 em memória para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
jwt.secret=test-secret-key-very-long-string-for-testing-purposes-only
jwt.expiration=86400000

# DataInitializer desabilitado nos testes
data.init.admin.email=admin@test.com
data.init.admin.password=admin123
data.init.user.email=user@test.com
data.init.user.password=user123